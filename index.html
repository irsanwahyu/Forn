<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surat</title>
  <link rel="stylesheet" href="style.css"
</head>
<body>
  <style>
    body {
      .amplop {
  position: relative;
  width: 300px;
  height: 190px;
  background: #ef9ba8;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  overflow: hidden;
}
/* Lipatan atas */
.lipatan {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-top: 105px solid #f27f8b;
  z-index: 2;
}
/* Lipatan depan */
.amplop::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 105px solid #f16f7b;
  z-index: 3;
}
.button {
    position: absolute;
    top: 70%; /* atur naik/turun */
    left: 50%;
    transform: translateX(-50%);

  padding: 15px 15px;
    text-decoration: none;
    background: hwb(308 40% 0%);
  color: white;
    border: 2px double white;
    cursor: pointer;
  
}

      background: url(bg.jpg);
    }
  </style>
  <div class="amplop">
  <div class="lipatan"></div>
  </div>

    <a href="page2.html" class="button">OPEN</a>

</body>
</html>
